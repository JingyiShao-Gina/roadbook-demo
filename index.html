<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 路书生成器</title>
<style>
/* VOICE work tool for travel sales staff: quiet, clear, fast
   IDEA a print-shop proof desk: the source sheet goes in on the left, the finished pocket roadbook comes out on the right
   PICTURE the live phone preview of the roadbook, updating as fields change
   COLOUR white ground, bamboo-ink green header field, pale leaf panels, chili red for the primary action
   TYPE system PingFang/YaHei throughout, Songti for the product name
   LAYOUT laptop: form column left, sticky phone preview right; phone: steps stacked, preview below */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1714);--ink:light-dark(#14201b,#e8efe9);--muted:light-dark(#5b6b63,#9fb0a7);--green:light-dark(#1f4d3a,#143528);--leaf:light-dark(#eef4ef,#17241e);--chili:light-dark(#c8322a,#ff6f61);--line:light-dark(#d6e0d9,#2a3a31);--field:light-dark(#ffffff,#0c1310)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow-x:clip}
.top{background:var(--green);color:#fff;padding:16px max(4vw,16px)}
.top .in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.top h1{font:700 24px/1.2 "Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;margin:0}
.top p{margin:0;font-size:14px;opacity:.85}
.grid{max-width:1240px;margin:0 auto;padding:20px max(4vw,16px) 48px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
.step{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;background:var(--bg)}
.step h2{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.step h2 span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:14px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;background:var(--leaf)}
.drop.over{border-color:var(--chili)}
.drop b{display:block;font-size:16px}
.drop small{color:var(--muted)}
#file{position:absolute;width:1px;height:1px;opacity:0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
button,.dl{font:inherit;font-size:15px;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--green)}
button.primary{background:var(--chili);border-color:var(--chili);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.status{font-size:14px;color:var(--muted);margin-top:10px;min-height:1.5em}
.status.err{color:var(--chili)}
details{margin-top:12px}
summary{cursor:pointer;color:var(--muted)}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{resize:vertical;line-height:1.5}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.contact{display:grid;grid-template-columns:5em minmax(0,1fr) minmax(0,1.4fr);gap:8px;margin-top:8px}
.daybox{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.daybox .dt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;margin-bottom:8px}
.daybox .dt b{font:700 20px "Songti SC","STSong",serif;color:var(--chili)}
.daybox textarea{min-height:120px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.found{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.found span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.preview{position:sticky;top:16px}
.phone{border:10px solid #1b1f1d;border-radius:36px;overflow:hidden;height:min(780px,calc(100vh - 110px));background:#fff;box-shadow:0 1px 0 var(--line)}
.phone iframe{width:100%;height:100%;border:0;display:block}
.preview p{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 0}
.empty{color:var(--muted);font-size:14px}
@media(max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}.preview{position:static}.phone{height:640px;max-width:420px;margin:0 auto}}
</style>
</head>
<body>
<header class="top"><div class="in"><h1>AI 路书生成器</h1><p>上传 Word / PDF 行程单，自动生成带导航和一键拨号的手机路书（MVP 演示版）</p></div></header>

<div class="grid">
  <main>
    <div class="step">
      <h2><span>1</span>导入行程资料</h2>
      <label class="drop" id="drop" for="file"><b>点击上传，或把文件拖到这里</b><small>支持 Word（.docx）、PDF、TXT</small></label>
      <input type="file" id="file" accept=".docx,.pdf,.txt">
      <div class="row"><span class="empty">没有资料？试试示例：</span><button type="button" id="sWord">大理丽江 5 日（Word）</button><button type="button" id="sPdf">西安 3 日（PDF）</button></div>
      <details id="pasteBox"><summary>或者直接粘贴行程文字</summary><textarea id="paste" rows="8" placeholder="第一天 抵达成都&#10;14:00 机场接机，入住春熙路示例酒店&#10;……"></textarea><div class="row"><button type="button" id="parseBtn">解析这段文字</button></div></details>
      <div class="status" id="status" role="status"></div>
    </div>

    <div class="step" id="edit">
      <h2><span>2</span>核对与修改</h2>
      <div id="form"><p class="empty">导入资料后，这里会出现识别出的标题、日期、每日行程和地点，可以直接修改。</p></div>
    </div>

    <div class="step">
      <h2><span>3</span>导出路书</h2>
      <div class="row" style="margin-top:0"><button type="button" class="primary" id="download">下载路书网页文件</button><button type="button" id="openNew">在新窗口打开预览</button></div>
      <p class="hint">下载得到一个 .html 文件，可以直接用微信发给客户，也可以发布成网址。</p>
    </div>
  </main>

  <aside class="preview" aria-label="路书预览">
    <div class="phone"><iframe id="frame" title="路书预览"></iframe></div>
    <p>手机预览，修改左侧内容会实时更新</p>
  </aside>
</div>

<script src="vendor/mammoth.browser.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="assets/roadbook.js"></script>
<script>
{
const $ = id => document.getElementById(id);
let data = null, html = '', timer = 0;
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say = (msg, err) => { const s = $('status'); s.textContent = msg; s.className = 'status' + (err ? ' err' : ''); };

async function pdfText(buf) {
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let out = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    let lastY = null;
    for (const it of tc.items) {
      const y = it.transform ? Math.round(it.transform[5]) : null;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 2 && !out.endsWith('\n')) out += '\n';
      out += it.str;
      if (it.hasEOL && !out.endsWith('\n')) out += '\n';
      lastY = y;
    }
    out += '\n';
  }
  return out;
}

async function readFile(name, buf) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (ext === 'docx') return (await mammoth.extractRawText({ arrayBuffer: buf })).value;
  if (ext === 'pdf') return pdfText(buf);
  if (ext === 'txt') return new TextDecoder('utf-8').decode(buf);
  throw new Error('暂不支持 .' + ext + ' 文件，请上传 .docx、.pdf 或 .txt（老版 .doc 请先另存为 .docx）');
}

async function load(name, buf) {
  say('正在读取「' + name + '」…');
  try {
    const text = await readFile(name, buf);
    if (!text.trim()) throw new Error('没有读到文字。如果是扫描件或图片 PDF，目前还不支持，请换成可复制文字的文件');
    useText(text, '已读取「' + name + '」');
  } catch (e) { say(e.message || '读取失败', true); }
}

function useText(text, label) {
  data = Roadbook.parseItinerary(text);
  if (!data.days.length) { say(label + '，但没有找到“第一天 / D1”这样的每日行程标记，请检查格式或直接粘贴文字修改。', true); }
  else say(label + '：识别出 ' + data.days.length + ' 天行程、' + data.days.reduce((n, d) => n + d.places.length, 0) + ' 个地点。请在第 2 步核对。');
  $('paste').value = text.trim();
  buildForm(); refresh();
}

function buildForm() {
  if (!data) return;
  while (data.contacts.length < 2) data.contacts.push({ role: data.contacts.length ? '司机' : '导游', name: '', tel: '' });
  const f = $('form');
  f.innerHTML =
    '<div class="fields">' +
    '<div style="grid-column:1/-1"><label class="f" for="f-title">路书标题</label><input id="f-title" data-k="title" value="' + esc(data.title) + '"></div>' +
    '<div><label class="f" for="f-org">旅行社名称</label><input id="f-org" data-k="org" value="' + esc(data.org) + '"></div>' +
    '<div><label class="f" for="f-start">出发日期</label><input id="f-start" type="date" data-k="startDate" value="' + esc(data.startDate) + '"></div>' +
    '<div><label class="f" for="f-pax">人数</label><input id="f-pax" data-k="pax" inputmode="numeric" value="' + esc(data.pax) + '"></div>' +
    '<div><label class="f" for="f-city">导航城市（多城市可留空）</label><input id="f-city" data-k="city" value="' + esc(data.city) + '"></div></div>' +
    '<div class="daybox"><label class="f">联系人（会出现在路书底部，客户可一键拨打）</label>' +
    data.contacts.map((c, i) => '<div class="contact"><input aria-label="角色" data-c="' + i + '" data-ck="role" value="' + esc(c.role) + '"><input aria-label="姓名" data-c="' + i + '" data-ck="name" placeholder="姓名" value="' + esc(c.name) + '"><input aria-label="电话" data-c="' + i + '" data-ck="tel" placeholder="电话" inputmode="tel" value="' + esc(c.tel) + '"></div>').join('') + '</div>' +
    data.days.map((d, i) =>
      '<div class="daybox" data-day="' + i + '"><div class="dt"><b>D' + (i + 1) + '</b><input aria-label="第' + (i + 1) + '天标题" data-dk="title" value="' + esc(d.title) + '"></div>' +
      '<label class="f" for="d' + i + '-text">行程（一行一项，行首可写时间，如 14:00）</label><textarea id="d' + i + '-text" data-dk="text">' + esc(d.text) + '</textarea>' +
      '<label class="f" for="d' + i + '-places" style="margin-top:8px">可导航的地点（用逗号分隔，可增删）</label><input id="d' + i + '-places" data-dk="places" value="' + esc(d.places.join('，')) + '">' +
      '<div class="found" id="d' + i + '-chips">' + d.chips.map(c => '<span>' + esc(c) + '</span>').join('') + '</div>' +
      '<label class="f" for="d' + i + '-tip" style="margin-top:8px">当日提示（选填）</label><input id="d' + i + '-tip" data-dk="tip" value="' + esc(d.tip) + '"></div>').join('') +
    '<div class="daybox fields">' +
    '<div><label class="f" for="f-inc">费用包含（一行一项）</label><textarea id="f-inc" rows="5" data-l="include">' + esc(data.include.join('\n')) + '</textarea></div>' +
    '<div><label class="f" for="f-exc">费用不含（一行一项）</label><textarea id="f-exc" rows="5" data-l="exclude">' + esc(data.exclude.join('\n')) + '</textarea></div>' +
    '<div style="grid-column:1/-1"><label class="f" for="f-notes">出行提示（一行一项）</label><textarea id="f-notes" rows="4" data-l="notes">' + esc(data.notes.join('\n')) + '</textarea></div></div>';
}

function onEdit(e) {
  const t = e.target; if (!data) return;
  if (t.dataset.k) data[t.dataset.k] = t.value;
  else if (t.dataset.ck) data.contacts[+t.dataset.c][t.dataset.ck] = t.value;
  else if (t.dataset.l) data[t.dataset.l] = t.value.split('\n').map(s => s.trim()).filter(Boolean);
  else if (t.dataset.dk) {
    const i = +t.closest('[data-day]').dataset.day, d = data.days[i];
    if (t.dataset.dk === 'places') { d.places = t.value.split(/[，,、\s]+/).filter(Boolean); d.placesEdited = true; }
    else {
      d[t.dataset.dk] = t.value;
      if (t.dataset.dk === 'text') {
        d.placesEdited = false; Roadbook.buildDay(d);
        $('d' + i + '-places').value = d.places.join('，');
        $('d' + i + '-chips').innerHTML = d.chips.map(c => '<span>' + esc(c) + '</span>').join('');
      }
    }
  }
  clearTimeout(timer); timer = setTimeout(refresh, 250);
}

function refresh() {
  if (!data) return;
  html = Roadbook.renderRoadbook(data);
  $('frame').srcdoc = html;
}

$('form').addEventListener('input', onEdit);
$('file').addEventListener('change', async e => { const f = e.target.files[0]; if (f) load(f.name, await f.arrayBuffer()); e.target.value = ''; });
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', async e => { const f = e.dataTransfer.files[0]; if (f) load(f.name, await f.arrayBuffer()); });
async function sample(path, name) {
  try { const r = await fetch(path); if (!r.ok) throw new Error(); load(name, await r.arrayBuffer()); }
  catch (e) { say('示例文件加载失败，请直接上传文件试试。', true); }
}
$('sWord').addEventListener('click', () => sample('samples/dali-lijiang-5d.docx', '大理丽江5日行程.docx'));
$('sPdf').addEventListener('click', () => sample('samples/xian-3d.pdf', '西安3日行程.pdf'));
$('parseBtn').addEventListener('click', () => { const t = $('paste').value; if (t.trim()) useText(t, '已解析粘贴的文字'); });
$('download').addEventListener('click', () => {
  if (!html) { say('请先导入行程资料。', true); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  a.download = (data.title || '路书') + '.html';
  document.body.appendChild(a); a.click(); a.remove();
  say('已下载「' + a.download + '」。');
});
$('openNew').addEventListener('click', () => {
  if (!html) { say('请先导入行程资料。', true); return; }
  window.open(URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' })), '_blank');
});
window.__roadbook = { get html() { return html; }, get data() { return data; } };
sample('samples/dali-lijiang-5d.docx', '大理丽江5日行程.docx');
}
</script>
</body>
</html>
